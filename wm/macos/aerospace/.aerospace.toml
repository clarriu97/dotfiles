# .aerospace.toml — i3-like tiling for macOS, same keys as wm/linux/i3/config.
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier: hold the LEFT Option key (like Super on i3). Karabiner turns
# Left Option + <window-manager key> into Ctrl+Option + <key>, so every binding
# below is ctrl-alt-*. Right Option is untouched for @ # | [ ] { } \ ~.
#
#   i3 $mod        -> Left Option              (ctrl-alt-*)
#   i3 $mod+Shift  -> Left Option + Shift      (ctrl-alt-shift-*)
#   i3 $mod+Ctrl   -> Left Option + Cmd        (ctrl-alt-cmd-*)
#
# Keys use qwerty positions. On a Spanish keyboard: 'semicolon' is ñ, 'slash' is -
# and 'rightSquareBracket' is +.
# tests/unit/wm.bats checks that every key bound here is remapped by Karabiner.

config-version = 2
start-at-login = true
after-startup-command = [
    'exec-and-forget borders active_color=0xff7aa2f7 inactive_color=0x00000000 width=5.0',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.bottom = 8
outer.top = 8

[mode.main.binding]
ctrl-alt-enter = 'exec-and-forget open -na Warp'
ctrl-alt-shift-enter = 'exec-and-forget open -na Ghostty'
ctrl-alt-d = 'exec-and-forget open -a Raycast'
ctrl-alt-shift-v = 'exec-and-forget open -na "Visual Studio Code"'
ctrl-alt-shift-b = 'exec-and-forget open -na "Brave Browser"'
ctrl-alt-cmd-e = 'exec-and-forget open ~'
ctrl-alt-cmd-s = 'exec-and-forget screencapture -ic'
ctrl-alt-shift-x = 'exec-and-forget pmset displaysleepnow'

ctrl-alt-shift-q = 'close'

ctrl-alt-j = 'focus left'
ctrl-alt-k = 'focus down'
ctrl-alt-l = 'focus up'
ctrl-alt-semicolon = 'focus right'
ctrl-alt-left = 'focus left'
ctrl-alt-down = 'focus down'
ctrl-alt-up = 'focus up'
ctrl-alt-right = 'focus right'

ctrl-alt-shift-j = 'move left'
ctrl-alt-shift-k = 'move down'
ctrl-alt-shift-l = 'move up'
ctrl-alt-shift-semicolon = 'move right'
ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-down = 'move down'
ctrl-alt-shift-up = 'move up'
ctrl-alt-shift-right = 'move right'

ctrl-alt-f = 'fullscreen'
ctrl-alt-s = 'layout v_accordion'
ctrl-alt-w = 'layout h_accordion'
ctrl-alt-e = 'layout tiles horizontal vertical'
ctrl-alt-shift-space = 'layout floating tiling'
ctrl-alt-slash = 'resize smart -50'
ctrl-alt-rightSquareBracket = 'resize smart +50'
ctrl-alt-b = 'balance-sizes'

ctrl-alt-1 = 'workspace 1'
ctrl-alt-2 = 'workspace 2'
ctrl-alt-3 = 'workspace 3'
ctrl-alt-4 = 'workspace 4'
ctrl-alt-5 = 'workspace 5'
ctrl-alt-6 = 'workspace 6'
ctrl-alt-7 = 'workspace 7'
ctrl-alt-8 = 'workspace 8'
ctrl-alt-9 = 'workspace 9'
ctrl-alt-0 = 'workspace 10'
ctrl-alt-tab = 'workspace-back-and-forth'

ctrl-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-alt-shift-9 = 'move-node-to-workspace 9'
ctrl-alt-shift-0 = 'move-node-to-workspace 10'

ctrl-alt-cmd-j = 'move-workspace-to-monitor --wrap-around prev'
ctrl-alt-cmd-semicolon = 'move-workspace-to-monitor --wrap-around next'
ctrl-alt-cmd-left = 'move-workspace-to-monitor --wrap-around prev'
ctrl-alt-cmd-right = 'move-workspace-to-monitor --wrap-around next'

ctrl-alt-shift-c = 'reload-config'
ctrl-alt-r = 'mode resize'

[mode.resize.binding]
j = 'resize width -50'
k = 'resize height +50'
l = 'resize height -50'
semicolon = 'resize width +50'
left = 'resize width -25'
down = 'resize height +25'
up = 'resize height -25'
right = 'resize width +25'
enter = 'mode main'
esc = 'mode main'
ctrl-alt-r = 'mode main'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 10'
